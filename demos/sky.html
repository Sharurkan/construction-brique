<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Démo ciel – Construction Brique</title>
    <style>
      @font-face { font-family: 'Andika'; src: url('/construction-brique/assets/fonts/Andika-Bold.woff2') format('woff2'); font-weight: 700; }
      @font-face { font-family: 'Andika'; src: url('/construction-brique/assets/fonts/Andika-Regular.woff2') format('woff2'); font-weight: 400; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #7ec8ff; touch-action: none;
        user-select: none; -webkit-user-select: none; font-family: 'Andika', system-ui, sans-serif; }
      canvas { display: block; cursor: grab; }
      canvas:active { cursor: grabbing; }
      #fps { position: fixed; top: 10px; left: 10px; padding: 5px 11px; border-radius: 10px; background: rgba(0, 0, 0, 0.5);
        color: #fff; font: 600 14px ui-monospace, monospace; pointer-events: none; line-height: 1.35; }
      #styles { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; }
      #styles .q { color: #fff; font-size: 19px; font-weight: 700; text-shadow: 0 2px 3px rgba(0, 0, 0, 0.45); margin-right: 4px; }
      .sbtn { display: flex; align-items: center; gap: 8px; font: 700 18px 'Andika', system-ui, sans-serif; padding: 6px 16px 6px 6px;
        border-radius: 30px; border: 3px solid #fff; background: rgba(255, 255, 255, 0.82); color: #234; cursor: pointer;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25); transition: transform 0.08s; }
      .sbtn b { display: inline-flex; width: 40px; height: 40px; border-radius: 50%; align-items: center; justify-content: center;
        color: #fff; font-size: 24px; }
      .sbtn.on { background: #fff; transform: scale(1.08); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35); outline: 4px solid rgba(255, 214, 0, 0.9); }
      .sbtn:not(.on) { opacity: 0.85; }
      #pause { position: fixed; top: 10px; right: 10px; font: 700 15px 'Andika', system-ui, sans-serif; padding: 8px 14px;
        border-radius: 12px; border: 0; background: #fff; color: #234; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); cursor: pointer; }
      #help { position: fixed; top: 52px; right: 10px; color: #fff; font-size: 13px; text-align: right; text-shadow: 0 1px 2px #000;
        pointer-events: none; }
      #legend { position: fixed; left: 8px; right: 8px; bottom: 8px; pointer-events: none; }
      #cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .card { background: rgba(255, 255, 255, 0.92); border-radius: 12px; padding: 7px 9px 8px; color: #1d2b3a; font-size: 12.5px;
        line-height: 1.3; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18); }
      .card .name { font-weight: 700; font-size: 15px; }
      .card .what { margin: 2px 0 3px; }
      .card .src { color: #4a5a6b; font-size: 11.5px; }
      .badge { display: inline-block; padding: 0 7px; border-radius: 7px; font-weight: 700; font-size: 11.5px; margin-left: 4px;
        vertical-align: 2px; }
      .badge.asset { background: #c9f2cf; color: #11571d; }
      .badge.proc { background: #e6dcff; color: #47228f; }
      #cost { margin-top: 6px; background: rgba(20, 35, 55, 0.82); color: #fff; border-radius: 10px; padding: 6px 12px; font-size: 13px;
        display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
      #cost .tag { font-weight: 700; padding: 1px 9px; border-radius: 8px; color: #234; }
      #cost .live { margin-left: auto; font-family: ui-monospace, monospace; font-size: 12.5px; color: #cfe8ff; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 26px;
        font-weight: 700; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4); pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="loading">Chargement du ciel…</div>
    <div id="fps">… fps</div>
    <div id="styles"><span class="q">Quel ciel ?</span></div>
    <button id="pause" type="button">⏸ Pause rotation</button>
    <div id="help">Glisser : regarder autour<br />Touches A / B / C : changer de style</div>
    <div id="legend">
      <div id="cards"></div>
      <div id="cost"></div>
    </div>
    <script type="module" src="./sky-demo.ts"></script>
  </body>
</html>
