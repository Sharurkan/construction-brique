<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Démo blocs précieux – Construction Brique</title>
    <style>
      @font-face { font-family: 'Andika'; src: url('/construction-brique/assets/fonts/Andika-Bold.woff2') format('woff2'); font-weight: 700; }
      @font-face { font-family: 'Andika'; src: url('/construction-brique/assets/fonts/Andika-Regular.woff2') format('woff2'); font-weight: 400; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #7ec8ff; touch-action: none;
        user-select: none; -webkit-user-select: none; font-family: 'Andika', system-ui, sans-serif; }
      canvas { display: block; }
      #fps { position: fixed; top: 8px; left: 8px; padding: 4px 10px; border-radius: 8px; background: rgba(0, 0, 0, 0.5);
        color: #fff; font: 600 14px ui-monospace, monospace; pointer-events: none; }
      #title { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 20px; font-weight: 700;
        text-shadow: 0 2px 3px rgba(0, 0, 0, 0.45); pointer-events: none; white-space: nowrap; }
      #pause { position: fixed; top: 8px; right: 8px; font: 700 15px 'Andika', system-ui, sans-serif; padding: 7px 14px;
        border-radius: 10px; border: 0; background: #fff; color: #234; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); cursor: pointer; }
      .label { position: fixed; left: 0; top: 0; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; color: #fff; font-size: 34px; font-weight: 700;
        border: 3px solid #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35); pointer-events: none; will-change: transform; }
      .rowtag { position: fixed; left: 0; top: 0; pointer-events: none; white-space: nowrap; }
      .rowtag > span { display: block; transform: translate(-50%, -50%); padding: 2px 8px; border-radius: 8px;
        background: rgba(255, 255, 255, 0.88); color: #234; font-size: 13px; font-weight: 700; }
      #legend { position: fixed; left: 8px; right: 8px; bottom: 8px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
        pointer-events: none; }
      .item { background: rgba(255, 255, 255, 0.9); border-radius: 10px; padding: 6px 8px 7px; color: #1d2b3a; font-size: 13px;
        line-height: 1.3; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18); }
      .item b.l { display: inline-flex; width: 24px; height: 24px; border-radius: 50%; color: #fff; align-items: center;
        justify-content: center; font-size: 15px; margin-right: 5px; vertical-align: middle; }
      .item .name { font-weight: 700; font-size: 14px; vertical-align: middle; }
      .item .cost { display: inline-block; margin-top: 3px; padding: 0 6px; border-radius: 6px; font-weight: 700; font-size: 12px; }
      .cost.none { background: #e3e8ee; } .cost.low { background: #c9f2cf; color: #11571d; }
      .cost.mid { background: #ffe7a8; color: #6b4a00; } .cost.high { background: #ffc9c3; color: #7a1308; }
      #help { position: fixed; top: 40px; right: 8px; color: #fff; font-size: 12px; text-shadow: 0 1px 2px #000; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="fps">… fps</div>
    <div id="title">Blocs précieux : quel effet choisir ?</div>
    <button id="pause" type="button">⏸ Pause rotation</button>
    <div id="help">Glisser : tourner · molette : zoom<br />Tout à gauche : les minerais, pour comparer</div>
    <div id="labels"></div>
    <div id="legend"></div>
    <script type="module" src="./gems-demo.ts"></script>
  </body>
</html>
