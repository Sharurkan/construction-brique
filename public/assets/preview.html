<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu des assets</title>
<style>
  @font-face { font-family: 'Andika'; src: url('fonts/Andika-Regular.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Andika'; src: url('fonts/Andika-Bold.woff2') format('woff2'); font-weight: 700; }
  body { font-family: 'Andika', sans-serif; background: #7ec8ff; color: #123; margin: 0; padding: 16px; }
  h1, h2 { margin: 16px 0 8px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; }
  figure { margin: 0; background: #fff8; border-radius: 10px; padding: 8px; text-align: center; width: 128px; }
  figure img { width: 96px; height: 96px; image-rendering: pixelated; display: block; margin: 0 auto 4px;
    background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  .icons figure img { background: #2b3440; border-radius: 50%; padding: 6px; box-sizing: border-box; image-rendering: auto; }
  .tinted canvas { width: 96px; height: 96px; display: block; margin: 0 auto 4px; image-rendering: pixelated; }
  figcaption { font-size: 13px; word-break: break-all; }
  button { font: inherit; font-size: 15px; padding: 8px 12px; border-radius: 10px; border: 0; background: #fff; cursor: pointer; }
  button:active { background: #ffe082; }
  .sample { font-size: 28px; }
</style>
</head>
<body>
<h1>Aperçu des assets</h1>
<p class="sample">Andika : Construis ta maison ! <b>Gras : Nouveau monde</b> — àéèçù 0123</p>

<h2>Tuiles (128 px)</h2>
<div class="grid" id="tiles"></div>

<h2>Laine teintée (tuile <code>wool</code> × couleur)</h2>
<div class="grid tinted" id="wool"></div>

<h2>Icônes</h2>
<div class="grid icons" id="icons"></div>

<h2>Sons</h2>
<div class="grid" id="sounds"></div>

<script>
  const TILES = ['grass_top','grass_side','dirt','stone','cobblestone','log_top','log_side','planks','leaves','brick',
    'glass','sand','diamond','gold','wool','bedrock','wool_red','wool_green','wool_blue','stone_brick','planks_red','snow','ice'];
  const TINTS = { white: 0xffffff, red: 0xe53935, orange: 0xff9800, yellow: 0xffeb3b, green: 0x43a047,
    blue: 0x1e88e5, purple: 0x8e24aa, pink: 0xf06292, black: 0x3a3a3a };
  const ICONS = { joystick_base: 'svg', joystick_knob: 'svg', btn_bg: 'svg', btn_break: 'png', btn_place: 'svg',
    btn_jump: 'svg', btn_fly: 'png', btn_fly_down: 'png', btn_new_world: 'png', btn_credits: 'png',
    btn_fullscreen: 'svg', btn_fullscreen_exit: 'svg', btn_sound_on: 'svg', btn_sound_off: 'svg' };
  const SOUNDS = { break_wood: 3, break_stone: 3, break_glass: 2, break_soft: 3, place: 3, step_grass: 3,
    step_wood: 2, step_stone: 2, jump: 1, click: 1, select: 1, new_world: 1 };

  function fig(parent, el, caption) {
    const f = document.createElement('figure');
    const c = document.createElement('figcaption');
    c.textContent = caption;
    f.append(el, c);
    parent.append(f);
  }
  const tiles = document.getElementById('tiles');
  for (const k of TILES) { const i = new Image(); i.src = 'textures/' + k + '.png'; fig(tiles, i, k); }

  const icons = document.getElementById('icons');
  for (const [k, ext] of Object.entries(ICONS)) { const i = new Image(); i.src = 'icons/' + k + '.' + ext; fig(icons, i, k); }

  const wool = new Image();
  wool.onload = () => {
    const box = document.getElementById('wool');
    for (const [name, hex] of Object.entries(TINTS)) {
      const cv = document.createElement('canvas');
      cv.width = cv.height = 128;
      const g = cv.getContext('2d');
      g.drawImage(wool, 0, 0);
      g.globalCompositeOperation = 'multiply';
      g.fillStyle = '#' + hex.toString(16).padStart(6, '0');
      g.fillRect(0, 0, 128, 128);
      fig(box, cv, name);
    }
  };
  wool.src = 'textures/wool.png';

  const sounds = document.getElementById('sounds');
  for (const [k, n] of Object.entries(SOUNDS)) {
    for (let i = 1; i <= n; i++) {
      const b = document.createElement('button');
      const name = k + '_' + i;
      b.textContent = '▶ ' + name;
      b.onclick = () => new Audio('sounds/' + name + '.ogg').play();
      sounds.append(b);
    }
  }
</script>
</body>
</html>
